name: redcap-htpd-shibd-container-ci
run-name: HTTPD-SHIBD CI triggered by @${{ github.actor }}

on:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches:
      - "dev"
    tags:
      - "v*.*.*"

jobs:
  redcap-container:
    uses: "aphp/ci-workflows/.github/workflows/container-ci.yml@bugfix/fix_sarif_file_bug"
    with:
      dockerfile-path: "httpd-shibd/Dockerfile"
      hadolint-ignore: "DL3008,DL3018,DL3041,SC2046"
      image-name: "ghcr.io/aphp/redcap-httpd-shibd"
      image-custom-tag: ""
      extra-build-args: ""
      dockle-ignore: ""
      trivy-ignore-vuln-ids: ""
      trivy-ignore-license-ids: ""